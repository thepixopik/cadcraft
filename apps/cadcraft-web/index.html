<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The AllCraft CAD</title>
  <link data-trunk rel="rust" data-bin="cadcraft-web" data-wasm-opt="0" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1d2127; }
    #cadcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #cadcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="cadcraft_canvas"></canvas>
  <div id="cadcraft_loading">
    <div style="margin-bottom:12px;font-size:15px;font-weight:600;color:#ececef">Loading The AllCraft CAD&hellip;</div>
    <div style="width:240px;height:5px;background:#32353d;border-radius:999px;overflow:hidden">
      <div id="cd_load_bar" style="width:2%;height:100%;background:#ef4444;border-radius:999px;transition:width 0.12s ease-out"></div>
    </div>
    <div id="cd_load_pct" style="margin-top:8px;font-size:12px;color:#9ca3af;font-variant-numeric:tabular-nums">Starting&hellip;</div>
  </div>
</body>
</html>
